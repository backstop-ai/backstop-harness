        claims:
          - Documents REQ-010 scope boundaries for future slices.
          - Records how domain modules map to SPEC-001 contracts CON-001 through CON-004.
          - Documents sharp edges for aggregate-version concurrency, atomic append/project semantics, artifact revision races, and stale or late completion suppression.
          - Helps reviewers confirm Seed 1 exports domain primitives only.
        depends_on:
